schema_version = 2

# Board description of the Xiaomi 13 (fuxi, SM8550), read by the unixnu build driver.
# Clean Format 2 port started 2026-11-01 from UniXNU/examples/device.
# Board values marked MOUSE233 come from mouse233/unixnu-fuxi @ 4545692515a54d8bfc94597a7ba72fd9b25bead5,
# the only fuxi port with device-verified memory/storage evidence (see porting.toml).
# Values marked PENDING must be re-measured on this project's own device before use.

[board]
name = "fuxi"
soc = "SM8550"
soc_source = "sm8550"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi 13"
# Unlike mouse233 (kit = "sheng", kept because its legacy archive builders address
# kits/sheng in 115 places), this clean Format 2 repo uses the board's own kit name.
# The layered driver's component archives do not use the legacy script paths.
kit = "fuxi"

[components]
# M1 minimal set (template default). Storage/display/GPU components are added
# per subsystem in porting order, each with its archive recipe and record entry.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
defconfig = "fuxi_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/fuxi.dts"
include_dirs = ["soc:dts"]

[firmware]
# From mouse233/unixnu-fuxi board.toml [firmware]: the fuxiPkg in uefi-fuxi.
# PINNED 2026-11-01: mouse233/uefi-fuxi, branch feat/ramdisk-test (the USB RAM
# receiver branch), commit 32b3b57e4bb542136e1a932062e5b10c81b5f287.
config = "fuxi"
dsc = "Platforms/Xiaomi/fuxiPkg/fuxi.dsc"
fd = "Build/fuxiPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = ["{uefi}", "{uefi}/Platforms/Xiaomi", "{tree}/package", "{tree}/drivers/DarwinBoot", "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm", "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/Xiaomi", "{uefi}/Silicium-ACPI/Silicon/Qualcomm"]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "fuxi"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "fuxi-research"

[bootimg]
# No dtb_node for splash_region: MOUSE233 — fuxi's own device tree already carries
# /reserved-memory/splash_region (0xb8000000, 0x2b00000); adding it again fails
# with FDT_ERR_EXISTS. The dtb path is set once the firmware preflight builds it.

[payload]
# MOUSE233 [payload]: volume FUXIESP, 192 MiB boot-image initrd FAT.
volume = "FUXIESP"
size_mib = 192
loader = "firmware"
title = "fuxi: iPadOS 17.7.11"
panic_screen = true
kernel_args = ["-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120"]

[payload.adt]
chip_id = "207"
# MOUSE233 [payload.adt] owned_memory_size, device-observed on fuxi.
owned_memory_size = "0x130000000"
unique_chip_id = "required"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "fuxi_defconfig"

# [userdata] from MOUSE233: GPT entry "userdata" of fuxi LUN 0, observed on its
# 12 GB + 256 GB unit with native-ufs-probe=10 on 2026-10-23. The project
# owner's device is the same 12 GB + 256 GB specification (confirmed
# 2026-11-01), so the geometry is adopted. PENDING: still verify against the
# owner's own device GPT at the storage stage before any userdata write.
[userdata]
first_lba = 0x2F7840
last_lba = 0x3AFC3FA
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]
